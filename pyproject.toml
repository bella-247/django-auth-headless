[project]
name = "django-auth-kit"
version = "0.1.0"
description = "Reusable Django authentication with django-allauth Headless and OAuth providers."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Abel Mekonen", email = "abelmekonen247@gmail.com" },
]
dependencies = [
    "django>=6.1.2,<7.0",
    "django-allauth[headless,socialaccount]>=65.20.1",
    "django-cors-headers>=4.9.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_auth_kit"]
