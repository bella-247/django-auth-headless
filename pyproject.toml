[project]
name = "django-allauth-cross-domain"
version = "0.3.0"
description = "OAuth cross-domain authentication bridge and bearer tokens for django-allauth Headless."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Abel Mekonen", email = "abelmekonen247@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "django>=4.2",
    "django-allauth[headless,socialaccount]>=65.0.0",
    "django-cors-headers>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14.0"]
ninja = ["django-ninja>=1.0.0"]

[project.urls]
Homepage = "https://github.com/bella-247/django-allauth-cross-domain"
Repository = "https://github.com/bella-247/django-allauth-cross-domain"
Issues = "https://github.com/bella-247/django-allauth-cross-domain/issues"
Changelog = "https://github.com/bella-247/django-allauth-cross-domain/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "django-ninja>=1.8.0",
    "djangorestframework>=3.18.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_allauth_cross_domain"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".superpowers",
    "docs/superpowers",
    ".github",
    "tests",
]

